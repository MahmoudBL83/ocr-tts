name: ocr_to_speech_app
description: Flutter client for the OCR-to-Speech pipeline
publish_to: none
version: 0.1.0

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.0.0'

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^2.32.0
  firebase_auth: ^4.7.0
  cloud_firestore: ^4.7.0
  http: ^1.2.0
  google_sign_in: ^6.2.1
  audioplayers: ^6.0.0
  camera: ^0.11.0
  flutter_secure_storage: ^9.0.0
  flutter_image_compress: ^2.0.0
  flutter_riverpod: ^2.0.0
  path_provider: ^2.1.5
  uuid: ^4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  mockito: ^5.3.2
  build_runner: ^2.4.7
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
